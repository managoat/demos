# demos.inevitable.fyi is retired. Its index of the apps built on the Fountain
# API moved onto the product site itself, at https://managoat.com/built-with,
# where the roster is a list in code (MarketingHTML.built_apps/0) that the
# suite checks — rather than hand-written HTML here that fell three apps
# behind and still named the pre-managoat server URL.
#
# The host keeps its DNS record, its certificate and its route; only the
# backend goes. Every path 308s to the one page that replaced it, so any link
# anyone saved still lands somewhere true.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: retired-to-built-with
  namespace: fountain-demos
spec:
  redirectRegex:
    # Matches any path on the host, including bare "/" — the old site was one
    # page, so there is nothing to map per-URL the way a docs tombstone does.
    regex: "^https?://demos\\.inevitable\\.fyi/.*"
    replacement: "https://managoat.com/built-with"
    # 308: permanent, and preserves the method. Browsers and crawlers both
    # take it as "this moved", which is what happened.
    permanent: true
