# Both routes answer with the redirect middleware and never reach a backend,
# so they point at Traefik's built-in noop service: there is no Deployment or
# Service in this namespace any more. A route still needs a `services` entry
# even when a middleware short-circuits it, and `noop@internal` is what that
# entry is for.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fountain-demos
  namespace: fountain-demos
  labels:
    app: fountain-demos
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`demos.inevitable.fyi`)"
      kind: Rule
      middlewares:
        - name: retired-to-built-with
          namespace: fountain-demos
      services:
        - name: noop@internal
          kind: TraefikService
  tls:
    secretName: fountain-demos-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fountain-demos-http
  namespace: fountain-demos
  labels:
    app: fountain-demos
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`demos.inevitable.fyi`)"
      kind: Rule
      # Scheme first, so a plain-http visitor lands on https and is then sent
      # on to the new page, rather than being redirected to an http URL.
      middlewares:
        - name: redirect-https
          namespace: default
        - name: retired-to-built-with
          namespace: fountain-demos
      services:
        - name: noop@internal
          kind: TraefikService
