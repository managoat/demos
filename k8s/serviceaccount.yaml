# The Infisical secrets-operator mints tokens for this SA to authenticate as the
# shared `agent-apps-operator` identity on magpie (Kubernetes-native auth; that
# identity accepts the SA name `agent-app-secrets` in any namespace). Every
# InfisicalSecret under apps/ names it. No RBAC needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-app-secrets
  namespace: managoat-demos
