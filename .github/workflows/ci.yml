name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily, so an app added to built-with shows up as a red build here within
    # a day even when nobody touches this repo. Drift is the whole failure mode
    # this page has ever had.
    - cron: "17 6 * * *"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  drift:
    # Separate job: a roster that disagrees with built-with should be loud, but
    # it must not be able to fail the build for a reason that is really the
    # network's, so it does not gate anything the check job produces.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run drift
