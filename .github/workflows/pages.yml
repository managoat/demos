name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Public phc_ project key; recordings are off when this repo
          # variable is unset (Settings → Secrets and variables → Actions).
          #
          # This is Fountain's own PostHog project, deliberately — a recording
          # is only worth much next to the server-side events for the same
          # account, and PostHog has no cross-project person. Pointing it
          # somewhere else splits every teammate in half.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
