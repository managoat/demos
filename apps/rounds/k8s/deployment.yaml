apiVersion: apps/v1
kind: Deployment
metadata:
  name: rounds
  namespace: managoat-demos
  labels:
    app: rounds
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rounds
  template:
    metadata:
      labels:
        app: rounds
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/rounds:sha-0dcb4a41daf283784112d106d8fab0e9ec9164e5
          ports:
            - containerPort: 8080
          # The GitHub App. The only way a round reaches a repository: the
          # agents hold read-only tokens, and this process is what writes.
          # Without it /gh answers 503 and nothing can be enrolled.
          envFrom:
            - secretRef:
                name: rounds-github-app
                optional: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 320Mi }
