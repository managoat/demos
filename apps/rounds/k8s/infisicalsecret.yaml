# Materializes Infisical `jhgaylor-playground` / prod / `/github-app` into the
# K8s Secret `rounds-github-app`.
#
# The same folder Mend reads: one GitHub App, one private key, one place. The
# key mints installation tokens for every installation of the App, so it lives
# here — in a server process — and never on a Fountain environment where an
# agent that reads untrusted repository content could reach it.
#
# The Deployment treats the secret as optional, so before it syncs the app still
# serves and simply cannot mint tokens.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: rounds-github-app
  namespace: rounds
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 65877c19-830f-49dc-b524-45764ffc1e4b
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: agent-app-secrets
        namespace: rounds
      secretsScope:
        projectSlug: jhgaylor-playground-vgtp
        envSlug: prod
        secretsPath: "/github-app"
        recursive: false
  managedSecretReference:
    secretName: rounds-github-app
    secretNamespace: rounds
    creationPolicy: Orphan
