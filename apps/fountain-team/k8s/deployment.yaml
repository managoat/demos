apiVersion: apps/v1
kind: Deployment
metadata:
  name: fountain-team
  namespace: fountain-team
  labels:
    app: fountain-team
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fountain-team
  template:
    metadata:
      labels:
        app: fountain-team
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/fountain-team:sha-39cca33951c7715d693c5592d912c5bc3337c10b
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
