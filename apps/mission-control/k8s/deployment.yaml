apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control
  namespace: mission-control
  labels:
    app: mission-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mission-control
  template:
    metadata:
      labels:
        app: mission-control
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/mission-control:sha-bbc1b08556f849e44d492052b593713c27889bef
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
