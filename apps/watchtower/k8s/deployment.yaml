apiVersion: apps/v1
kind: Deployment
metadata:
  name: watchtower
  namespace: watchtower
  labels:
    app: watchtower
spec:
  replicas: 2
  selector:
    matchLabels:
      app: watchtower
  template:
    metadata:
      labels:
        app: watchtower
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/watchtower:sha-b4ec6da629af45efaecc7eb25203fa1cd507e073
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
