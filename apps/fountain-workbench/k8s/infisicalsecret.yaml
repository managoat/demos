# Materializes Infisical `jhgaylor-playground` / prod / `/workbench` into the K8s
# Secret `workbench-secrets`, which the Deployment reads with envFrom.
#
# Carries WORKBENCH_SECRET, which encrypts the stored Fountain keys — the
# volume's data is unreadable without it. Until the move into managoat-demos
# this Secret was created by hand and lived only in the cluster.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: workbench-secrets
  namespace: managoat-demos
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 65877c19-830f-49dc-b524-45764ffc1e4b
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: agent-app-secrets
        namespace: managoat-demos
      secretsScope:
        projectSlug: jhgaylor-playground-vgtp
        envSlug: prod
        secretsPath: "/workbench"
        recursive: false
  managedSecretReference:
    secretName: workbench-secrets
    secretNamespace: managoat-demos
    creationPolicy: Orphan
