# The environment and agent for working on the workbench itself, on Fountain.
#
#   WORKBENCH_TOKEN=ftn_… fountain apply -f fountain/manifest.yml
#
# WORKBENCH_TOKEN is a Fountain API key belonging to the workbench's owner —
# it is what the agent authenticates to the workbench's MCP endpoint with
# (see `mcp_servers` below). Apply refuses to run without it rather than
# quietly shipping an agent whose tools 401. Fountain keeps it as an
# environment secret; rotate with `fountain keys create` + re-apply.
#
# In the workbench, make a project with environment `fountain-workbench` and
# the `jhgaylor` vault (GitHub token + git identity), and pull the
# `fountain-workbench` agent onto its work items. No vault is defined here:
# the project supplies one, and the repo is public, so the clone needs none.
#
# Checkouts are mounted under /home/sprite/work, not /workspace: Fountain's
# disk reads (`GET /api/sandboxes/:id/{files,file,diff}`, ADR 0039) are
# confined to /home/sprite and the runtime's cwd, and the workbench's Changes
# view is built on them. A repository anywhere else is one the view cannot
# show. The setup script's last step installs the snapshot hook that tells the
# workbench *when* to look (server/hook.ts).
apiVersion: fountain.dev/v1
kind: Environment
metadata:
  name: fountain-workbench
spec:
  networking_type: unrestricted
  packages:
    apt:
      - jq
      - ripgrep
      - unzip
    node: "24"
  env_vars:
    LANG: C.UTF-8
  # Resolved at apply time from the operator's shell; Fountain then has it in
  # the merged secret map that `mcp_servers` is substituted against at
  # provision time. On the environment rather than the vault so the agent
  # works in any project, whichever vault that project supplies.
  secrets:
    WORKBENCH_TOKEN: ${WORKBENCH_TOKEN}
  repositories:
    - url: https://github.com/managoat/fountain-workbench
      mount_path: /home/sprite/work/fountain-workbench
      secret_key: GITHUB_TOKEN
    # The API the workbench is built on: OpenAPI, ADRs, the SDK source.
    - url: https://github.com/BinaryBourbon/fountain
      mount_path: /home/sprite/work/fountain
      secret_key: GITHUB_TOKEN
  setup_script: |
    set -euxo pipefail

    # Bun is the toolchain (runtime, test runner, bundler via vite).
    curl -fsSL https://bun.sh/install | bash
    export PATH="$HOME/.bun/bin:$PATH"
    echo 'export PATH="$HOME/.bun/bin:$PATH"' >> ~/.bashrc

    # gh, for the pull request at the end of the job.
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      | sudo tee /etc/apt/sources.list.d/github-cli.list
    sudo apt-get update -qq && sudo apt-get install -y -qq gh

    cd /home/sprite/work/fountain-workbench
    bun install --frozen-lockfile
    bun run typecheck
    echo 'fountain-workbench ready: bun test / bun run typecheck / bun run build / bun run server'

    # The workbench's snapshot hook: posts branch, head and status on every
    # edit, commit and turn end, so the Changes view knows when to read the diff.
    curl -fsSL https://fountain-workbench.demo.managoat.com/hook/install.sh | bash
---
apiVersion: fountain.dev/v1
kind: Agent
metadata:
  name: fountain-workbench
spec:
  runtime: claude
  model: anthropic/claude-opus-5
  environment: fountain-workbench
  description: >
    Works on jhgaylor/fountain-workbench — the shared dev workstation on the
    Fountain API (Bun server + React SPA). Reads the README first, runs the
    gate, opens one pull request.
  system: |
    You work on Fountain Workbench: a Bun server (server/) and a React SPA
    (src/) on the Fountain API. The checkout is at /home/sprite/work/fountain-workbench;
    Fountain itself (the API this is built on: apps/fountain, docs/, decisions/,
    sdk/typescript) is at /home/sprite/work/fountain for reference.

    Before you touch anything, in this order:
      1. cd /home/sprite/work/fountain-workbench && git fetch origin && git checkout -B <branch> origin/main
         The sandbox may have warm-started from a checkpoint, so the checkout
         on disk can be days old. Fetch before you read it.
      2. Read README.md — how sign-in, sharing, and the project-scoped proxy
         (/f/<project>) work, and why every conversation runs on the project
         owner's key. server/app.ts lists the routes; server/proxy.ts is the
         boundary a member must not cross. Keep it that way.
      3. For anything touching the Fountain API, read the OpenAPI document in
         the SDK (node_modules/@agentshit/fountain-sdk/dist/generated/openapi.d.ts)
         or /home/sprite/work/fountain/docs before guessing a shape.

    The gate, in the foreground, before you push:
      bun run typecheck && bun test && bun run build
    Anything you background dies when your turn ends. Read the output, not
    the exit code, and confirm "0 fail" from bun test. Server code is tested
    against a fake Fountain in server/app.test.ts — add a case there for any
    change to what the proxy admits.

    Never push to main: a push to main deploys to fountain-workbench.demo.managoat.com.
    Commit with a message that says what changed and why, push a branch, and
    open one pull request with `gh pr create`, with the gate output you
    actually saw. Never end a turn with work pending — the turn that did the
    work is the turn that states the pushed commit sha.

    The workbench's own work items are yours to file: the `workbench` MCP
    server (mcp__workbench__*) lists projects and work items and creates
    them. Use it when a turn turns up work that is not this turn's — a
    follow-up, something you found and are not fixing, a piece for someone
    else — instead of leaving it in prose for a person to re-type. Call
    list_projects first, and list_work_items before you create one, so you
    add to the list rather than duplicate it; say in your answer what you
    filed. Marking an item done is deliberately not a tool: that retires
    the item's conversations and takes their computers down, quite possibly
    your own.
  # The work items as tools (server/mcp.ts). `${VAR}` is resolved by Fountain
  # at provision time, so the sandbox's .mcp.json is written with the key
  # already in it. Deliberately not `$${FOUNTAIN_TOKEN}` (the sprite's own
  # per-conversation key, left for the runtime to expand): the endpoint
  # accepts that key, but the server never registered — every agent whose
  # MCP servers work here resolves its header this way.
  mcp_servers:
    workbench:
      type: http
      url: https://fountain-workbench.demo.managoat.com/mcp
      headers:
        Authorization: "Bearer ${WORKBENCH_TOKEN}"
  permission_policy:
    default: auto_allow
