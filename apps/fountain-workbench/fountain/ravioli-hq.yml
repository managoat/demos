---
apiVersion: fountain.dev/v1
kind: Agent
metadata:
  name: ravioli-waitlist
spec:
  runtime: claude
  model: anthropic/claude-sonnet-5
  environment: ravioli-waitlist
  description: >
    Works on ravioli-hq/ravioli-waitlist — the tryravioli.com landing page,
    static assets on Cloudflare. Reads the README first, runs the tests,
    opens one pull request.
  system: |
    You work on Ravioli's landing page: github.com/ravioli-hq/ravioli-waitlist,
    live at https://tryravioli.com — a plain static page (public/index.html,
    inline CSS/JS, no build) served as Cloudflare static assets; wrangler.jsonc
    is the deployment. The checkout is at /workspace/ravioli-waitlist with
    Node 22 and the deps installed. `gh` is authenticated: `gh issue list`,
    `gh issue view N`, `gh pr list` all work against this repo from inside
    the checkout.

    Before you touch anything:
      1. cd /workspace/ravioli-waitlist && git fetch origin && git checkout -B <branch> origin/main
      2. Read README.md — especially why the Worker keeps the name
         `ravioli-waitlist` (the custom domain is bound to it; never rename
         it), and which assets are mirrors of ravioli-client's.
      3. For a GitHub issue, `gh issue view N --comments` before you plan.

    The gate, in the foreground, before you push: `npm test`. There is no
    Cloudflare token here: do not run `wrangler deploy`; a merge deploys.

    Never push to main. Commit with a message that says what changed and
    why, push a branch, and open one pull request with `gh pr create`, with
    the test output you actually saw. Never end a turn with work pending.
  permission_policy:
    default: auto_allow

# ── ravioli-legal ───────────────────────────────────────────────────────────
---
apiVersion: fountain.dev/v1
kind: Environment
metadata:
  name: ravioli-legal
spec:
  networking_type: unrestricted
  packages:
    apt:
      - jq
      - ripgrep
  env_vars:
    LANG: C.UTF-8
  repositories:
    - url: https://github.com/ravioli-hq/ravioli-legal
      mount_path: /workspace/ravioli-legal
      secret_key: GITHUB_TOKEN
  setup_script: |
    set -euxo pipefail
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      | sudo tee /etc/apt/sources.list.d/github-cli.list
    sudo apt-get update -qq && sudo apt-get install -y -qq gh
    echo 'ravioli-legal ready: static HTML, served by GitHub Pages from main'
---
apiVersion: fountain.dev/v1
kind: Agent
metadata:
  name: ravioli-legal
spec:
  runtime: claude
  model: anthropic/claude-sonnet-5
  environment: ravioli-legal
  description: >
    Works on ravioli-hq/ravioli-legal — the public legal pages (privacy
    policy, account deletion) for the Ravioli app, on GitHub Pages.
  system: |
    You work on Ravioli's public legal pages: github.com/ravioli-hq/ravioli-legal,
    static HTML served by GitHub Pages at https://ravi-hq.github.io/ravioli-legal/
    (privacy/, delete/, index.html). The checkout is at /workspace/ravioli-legal.
    `gh` is authenticated: `gh issue list`, `gh issue view N`, `gh pr list`
    all work against this repo from inside the checkout.

    Before you touch anything:
      1. cd /workspace/ravioli-legal && git fetch origin && git checkout -B <branch> origin/main
      2. Read README.md and the page you are changing in full. These are
         legal documents: change exactly what was asked, keep the wording
         plain, and never invent a policy position — ask in the pull request
         if the request leaves one open.

    There is no build and no test suite; open each changed page's HTML and
    check it is well-formed. A merge to main publishes.

    Never push to main. Commit with a message that says what changed and
    why, push a branch, and open one pull request with `gh pr create`.
    Never end a turn with work pending.
  permission_policy:
    default: auto_allow
