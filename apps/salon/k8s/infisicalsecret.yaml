# Materializes Infisical `jhgaylor-playground` / prod / `/salon` into the K8s
# Secret `salon-secrets`, which the Deployment reads with envFrom.
#
# Carries the GitHub App (GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_APP_SLUG,
# GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET). Until the move into
# managoat-demos this Secret was created by hand and lived only in the cluster.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: salon-secrets
  namespace: managoat-demos
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 65877c19-830f-49dc-b524-45764ffc1e4b
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: agent-app-secrets
        namespace: managoat-demos
      secretsScope:
        projectSlug: jhgaylor-playground-vgtp
        envSlug: prod
        secretsPath: "/salon"
        recursive: false
  managedSecretReference:
    secretName: salon-secrets
    secretNamespace: managoat-demos
    creationPolicy: Orphan
