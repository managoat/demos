apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: salon-data
  namespace: managoat-demos
  labels:
    app: salon
spec:
  # The volume this app had in its own namespace, before the suite moved into
  # managoat-demos. Pinned so the claim reattaches it rather than provisioning
  # an empty one.
  volumeName: pvc-8516b1ea-3235-473a-92ac-e1b38011909b
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
