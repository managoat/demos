# Materializes Infisical `jhgaylor-playground` / prod / `/drydock` into the K8s
# Secret `drydock-secrets`.
#
# Its own folder rather than the shared `/github-app` one that rounds and mend
# read, because drydock's is not only a GitHub App: the same Secret carries the
# Fountain key every machine in the app runs on and the Sprites token that opens
# a shell on one. Those are three different blast radii in one envelope, and
# putting them in a folder of their own is what keeps a future reader of
# `/github-app` from assuming its scope is still just GitHub.
#
# The trust boundary is worth restating because it is easy to under-read: any
# workload Flux applies that mounts a ServiceAccount named `agent-app-secrets`
# can read this whole project, not only its own folder. The reviewed PR is the
# control. Anything more sensitive than this wants its own Infisical project.
#
# Contents (all of them read at boot by server/config.ts):
#
#   FOUNTAIN_API_KEY            the account every machine here is built on
#   DRYDOCK_SECRET              encrypts stored GitHub tokens at rest
#   GITHUB_APP_ID
#   GITHUB_APP_SLUG             `managoat-drydock` — a GitHub App's name is
#                               global, and `drydock` is a taken account
#   GITHUB_OAUTH_CLIENT_ID      the App's OAuth client, for signing people in
#   GITHUB_OAUTH_CLIENT_SECRET
#   GITHUB_APP_PRIVATE_KEY      raw PEM; `\n`-escaped newlines are repaired
#   SPRITES_TOKEN               optional — with it, the terminal is live
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: drydock-secrets
  namespace: drydock
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 65877c19-830f-49dc-b524-45764ffc1e4b
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: agent-app-secrets
        namespace: drydock
      secretsScope:
        projectSlug: jhgaylor-playground-vgtp
        envSlug: prod
        secretsPath: "/drydock"
        recursive: false
  managedSecretReference:
    secretName: drydock-secrets
    secretNamespace: drydock
    creationPolicy: Orphan
