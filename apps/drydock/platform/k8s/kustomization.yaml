# https://drydock.demo.managoat.com (and drydock.apps.inevitable.fyi): drydock on home-cloud's app platform, applied by Flux
# from this directory (its pointer is in Forgejo jhgaylor/apps). platform/ is rendered from
# ../app.yaml by arugula-salad/planter's platform-app (don't edit it; re-render after changing
# app.yaml); this file is yours: kustomize patches go here. .github/workflows/build.yml pins newTag.
# Every app shares the `planter-apps` namespace, which the platform owns.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: planter-apps
resources:
  - platform
images:
  - name: ghcr.io/managoat/drydock
    # Pinned by .github/workflows/build.yml on every build of this app. `unpinned` is a placeholder
    # that does not exist: the app does not run until CI has replaced it.
    newTag: unpinned
patches:
  # What app.yaml can't say: plain settings, and more memory than the platform's default.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: drydock
      spec:
        template:
          spec:
            containers:
              - name: drydock
                env:
                  - name: FOUNTAIN_URL
                    value: "https://managoat.com"
                  - name: STATIC_DIR
                    value: "/app/dist"
                  - name: PUBLIC_URL
                    value: "https://drydock.demo.managoat.com"
                resources:
                  limits:
                    memory: 384Mi
