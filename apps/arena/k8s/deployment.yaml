apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena
  namespace: arena
  labels:
    app: arena
spec:
  replicas: 2
  selector:
    matchLabels:
      app: arena
  template:
    metadata:
      labels:
        app: arena
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/arena:sha-e4e0104f5d4520f2e285e1e7ef9d2b2f0eb6a413
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
