# :8080 unprivileged; /healthz for the k8s probes; SPA fallback for client routing.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1024;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    location ~* \.(js|css|svg|png|woff2)$ { add_header Cache-Control "public, max-age=3600"; }
    location / { try_files $uri $uri/ /index.html; }
}

# demos.inevitable.fyi was the index's first home: every path goes to the front page here.
server {
    listen 8080;
    server_name demos.inevitable.fyi;
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { return 301 https://demo.managoat.com/; }
}
