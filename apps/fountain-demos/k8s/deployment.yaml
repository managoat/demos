apiVersion: apps/v1
kind: Deployment
metadata:
  name: fountain-demos
  namespace: fountain-demos
  labels:
    app: fountain-demos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fountain-demos
  template:
    metadata:
      labels:
        app: fountain-demos
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/fountain-demos:sha-5af2ac13a55274592c13c68e6cc2c1e5b4b797ec
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 96Mi }
