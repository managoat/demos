# demo.managoat.com serves the index. demos.inevitable.fyi, its first home,
# never reaches a backend: the redirect middleware short-circuits it, and a
# route still needs a `services` entry even then, which is what Traefik's
# built-in `noop@internal` is for.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fountain-demos
  namespace: fountain-demos
  labels:
    app: fountain-demos
spec:
  entryPoints:
    - websecure
  routes:
    - match: "Host(`demo.managoat.com`)"
      kind: Rule
      services:
        - name: fountain-demos
          port: 80
    - match: "Host(`demos.inevitable.fyi`)"
      kind: Rule
      middlewares:
        - name: moved-to-demo-index
          namespace: fountain-demos
      services:
        - name: noop@internal
          kind: TraefikService
  tls:
    secretName: fountain-demos-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fountain-demos-http
  namespace: fountain-demos
  labels:
    app: fountain-demos
spec:
  entryPoints:
    - web
  routes:
    - match: "Host(`demo.managoat.com`)"
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: default
      services:
        - name: fountain-demos
          port: 80
    - match: "Host(`demos.inevitable.fyi`)"
      kind: Rule
      # Scheme first, so a plain-http visitor lands on https and is then sent
      # on to the new page, rather than being redirected to an http URL.
      middlewares:
        - name: redirect-https
          namespace: default
        - name: moved-to-demo-index
          namespace: fountain-demos
      services:
        - name: noop@internal
          kind: TraefikService
