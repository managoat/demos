# Generated from app.yaml by arugula-salad/planter's platform-app (needs.secrets). Don't edit: the next
# build of main renders it again. Change app.yaml, or patch it from k8s/kustomization.yaml.
# The app's runtime secrets (GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY, GITHUB_APP_SLUG, GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET): Infisical `planter-apps-md-qs` / prod / `/mend`,
# materialized as the Secret mend-secrets. Every secret in the folder is loaded, listed in app.yaml
