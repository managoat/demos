# The Infisical secrets-operator mints tokens for this SA to authenticate as the
# shared `agent-apps-operator` identity on magpie (Kubernetes-native auth; that
# identity accepts the SA name `agent-app-secrets` in any namespace). No RBAC
# needed, and no per-app identity to create.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-app-secrets
  namespace: mend
