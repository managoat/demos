# Materializes Infisical project `jhgaylor-playground` / env `prod` / folder
# `/github-app` into the K8s Secret `mend-github-app`, which the Deployment reads with
# envFrom.
#
# That secret is the GitHub App: its private key, OAuth client secret, and the
# HMAC key used to sign grants. It lives here rather than on a Fountain
# environment because the App's private key mints installation tokens for every
# installation of the App — far too broad a credential to hand an agent that
# reads untrusted repository content.
#
# The Deployment treats it as optional, so if this has not synced yet the app
# still serves and simply falls back to pasted tokens.
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: mend-github-app
  namespace: mend
spec:
  hostAPI: http://infisical.infisical.svc.cluster.local:8080
  resyncInterval: 60
  authentication:
    kubernetesAuth:
      identityId: 65877c19-830f-49dc-b524-45764ffc1e4b
      autoCreateServiceAccountToken: true
      serviceAccountRef:
        name: agent-app-secrets
        namespace: mend
      secretsScope:
        projectSlug: jhgaylor-playground-vgtp
        envSlug: prod
        secretsPath: "/github-app"
        recursive: false
  managedSecretReference:
    secretName: mend-github-app
    secretNamespace: mend
    creationPolicy: Orphan
