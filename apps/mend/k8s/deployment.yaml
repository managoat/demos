apiVersion: apps/v1
kind: Deployment
metadata:
  name: mend
  namespace: mend
  labels:
    app: mend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mend
  template:
    metadata:
      labels:
        app: mend
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/mend:sha-b4ec6da629af45efaecc7eb25203fa1cd507e073
          ports:
            - containerPort: 8080
          # Everything the GitHub App needs. Optional on purpose: without the
          # secret the /gh endpoints answer 503 and the app falls back to
          # pasted tokens, so a missing secret degrades instead of breaking.
          envFrom:
            - secretRef:
                name: mend-github-app
                optional: true
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 320Mi }
