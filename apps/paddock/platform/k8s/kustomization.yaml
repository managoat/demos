# https://paddock.demo.managoat.com (and paddock.apps.inevitable.fyi): paddock on home-cloud's app platform, applied by Flux
# from this directory (its pointer is in Forgejo jhgaylor/apps). platform/ is rendered from
# ../app.yaml by arugula-salad/planter's platform-app (don't edit it; re-render after changing
# app.yaml); this file is yours: kustomize patches go here. .github/workflows/build.yml pins newTag.
# Every app shares the `planter-apps` namespace, which the platform owns.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: planter-apps
resources:
  - platform
images:
  - name: ghcr.io/managoat/paddock
    # Pinned by .github/workflows/build.yml on every build of this app. `unpinned` is a placeholder
    # that does not exist: the app does not run until CI has replaced it.
    newTag: sha-f262a6975d788a37fffed1e254c44d7fe7357734
patches:
  # What app.yaml can't say: plain settings.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paddock
      spec:
        template:
          spec:
            containers:
              - name: paddock
                env:
                  - name: FOUNTAIN_URL
                    value: "https://managoat.com"
                  - name: STATIC_DIR
                    value: "/app/dist"
                  - name: PUBLIC_URL
                    value: "https://paddock.demo.managoat.com"
                  - name: ANONYMOUS_START
                    value: "1"
                  - name: ANONYMOUS_TTL_SECONDS
                    value: "86400"
                  - name: ANONYMOUS_BUDGET_USD
                    value: "1"
