apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paddock-data
  namespace: managoat-demos
  labels:
    app: paddock
spec:
  # The volume this app had in its own namespace, before the suite moved into
  # managoat-demos. Pinned so the claim reattaches it rather than provisioning
  # an empty one.
  volumeName: pvc-215d7065-a228-4986-98bc-d94992529018
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
