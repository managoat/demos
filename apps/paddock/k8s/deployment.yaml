apiVersion: apps/v1
kind: Deployment
metadata:
  name: paddock
  namespace: paddock
  labels:
    app: paddock
spec:
  replicas: 2
  selector:
    matchLabels:
      app: paddock
  template:
    metadata:
      labels:
        app: paddock
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/paddock:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
