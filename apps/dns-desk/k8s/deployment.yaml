apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-desk
  namespace: dns-desk
  labels:
    app: dns-desk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dns-desk
  template:
    metadata:
      labels:
        app: dns-desk
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/dns-desk:sha-62f0d8a45740782413a18b0f74e3a7bb685fb3e4
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
