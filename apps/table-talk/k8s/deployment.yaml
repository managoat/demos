apiVersion: apps/v1
kind: Deployment
metadata:
  name: table-talk
  namespace: table-talk
  labels:
    app: table-talk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: table-talk
  template:
    metadata:
      labels:
        app: table-talk
    spec:
      containers:
        - name: web
          # Pinned to an immutable sha tag by .github/workflows/build.yml.
          image: ghcr.io/managoat/table-talk:sha-9dbb332dab6d555fa5e948c956dfa9b126f3000e
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
